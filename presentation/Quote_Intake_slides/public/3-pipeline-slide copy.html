<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<title>Pipeline Walk-through</title>
<style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap');
  *, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }
  html, body { width:100%; height:100%; background:#fff; font-family: 'Plus Jakarta Sans', -apple-system, sans-serif; overflow:hidden; }

  #root {
    position: relative; /* STEP 2a: Keeps background contained inside the slide area */
    width:100%; height:100%;
    display:flex; flex-direction:column;
    padding:30px 40px 15px; gap:15px;
    outline:none;
    align-items:center; /* Centers content horizontally */
    justify-content:center; /* Centers content vertically */
  }

  /* STEP 2b: Added the background element styles matching your other slides */
  .s2-bg {
    position: absolute !important;
    inset: 0;
    background-image: url('logo_FRI/path4.png');
    background-repeat: no-repeat;
    background-position: center;
    background-size: 90%;
    opacity: 0.03;
    z-index: 0 !important;
    pointer-events: none;
  }

  .slide-title { 
    text-align:center; /* Centered title text */
    font-size:36px; /* Increased title size */
    font-weight:800; 
    color:#0107ba; 
    flex-shrink:0; 
    letter-spacing:.5px;
    margin-bottom: 10px;
    width: 100%;
    position: relative; /* STEP 2c: Pulls header above background */
    z-index: 2;
  }

  #main-area {
    flex:1; min-height:0;
    display:flex; flex-direction:row; gap:8px;
    width:100%;
    max-width:1100px; /* Constrains max horizontal stretching for a clean look */
    justify-content:center;
    position: relative; /* STEP 2d: Pulls interactive contents above background */
    z-index: 2;
  }

  #left-col {
    flex:1;
    display:flex; flex-direction:column; gap:8px;
    min-height:0;
    align-items:center;
  }
  #canvas { width:100%; flex:1; min-height:300px; display:flex; justify-content:center; }
  #canvas svg { width:100%; height:100%; display:block; overflow:visible; }

  .controls { display:flex; align-items:center; justify-content:space-between; flex-shrink:0; width:100%; max-width:960px; }
  .dots { display:flex; gap:6px; flex-wrap:wrap; max-width:280px; }
  .dot { width:9px; height:9px; border-radius:50%; background:#ddd; transition:background .3s; flex-shrink:0; }
  .dot.active { background:#0107ba; }
  .dot.cur { box-shadow:0 0 0 2px #fff,0 0 0 3.5px #0107ba; }
  .counter { font-size:13px; font-weight:bold; opacity:.6; }
  .hint { text-align:center; font-size:11px; opacity:.4; flex-shrink:0; width:100%; }

  /* Smooth layout transitions for both separate elements */
  #traveler-doc, #traveler-box { transition: transform 0.65s cubic-bezier(0.4,0,0.2,1); }

  /* Expanded Moving Box Dimensions and Rich Scrolling Media Content */
  .media-box-container {
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    padding: 8px;
    background: rgba(255, 255, 255, 0.98);
    border: 2.5px solid #0107ba;
    border-radius: 8px;
    box-shadow: 0 6px 16px rgba(0,0,0,0.22);
  }
  
  .media-header-label {
    font-size: 11px; /* Slightly clearer tracking headers */
    font-weight: bold;
    text-transform: uppercase;
    margin-bottom: 5px;
    color: #111;
    border-bottom: 1.5px solid #e2e8f0;
    padding-bottom: 3px;
    flex-shrink: 0;
  }

  .media-content-stream {
    flex: 1;
    overflow-y: auto;
    overflow-x: hidden;
    display: flex;
    flex-direction: column;
    gap: 6px;
    padding-right: 2px;
  }

  .media-content-stream::-webkit-scrollbar {
    width: 4px;
  }
  .media-content-stream::-webkit-scrollbar-thumb {
    background: #cbd5e1;
    border-radius: 2px;
  }

  .stream-img {
    width: 100%;
    height: auto;
    border-radius: 4px;
    border: 1px solid #cbd5e1;
    display: block;
    background: #fafafa;
  }

  .stream-text {
    font-size: 10px;
    line-height: 1.3;
    color: #334155;
    padding: 2px 1px;
    word-break: break-word;
  }
</style>
</head>
<body>
<div id="root" tabindex="0">
  <div class="s2-bg"></div>

  <div class="slide-title">Pipeline Walk-through</div>

  <div id="main-area">
    <div id="left-col">
      <div id="canvas">
        <svg id="svg" xmlns="http://www.w3.org/2000/svg" viewBox="-5 -50 975 455" preserveAspectRatio="xMidYMid meet"></svg>
      </div>
      <div class="controls">
        <div class="dots" id="dots"></div>
        <div class="counter" id="counter">Step 0 / 9</div>
      </div>
    </div>
  </div>
</div>

<script>
const NS='http://www.w3.org/2000/svg';
const $=id=>document.getElementById(id);
function mk(tag,attrs){
  const e=document.createElementNS(NS,tag);
  if(attrs) for(const [k,v] of Object.entries(attrs)) e.setAttribute(k,String(v));
  return e;
}
function tx(el,s){el.textContent=s;return el;}

// ── BALANCED VERTICAL DRIFT ────────────────────────────────────────────────
const VW=960,VH=300;
const Y_FWD=0,Y_MID=180,Y_BWD=360;
const IOW=76,IOH=76;
const X_PDF=48,X_JSON=VW-50;
const FWD_L=X_PDF+IOW/2+14,FWD_R=X_JSON-IOW/2-14;
const FWD_T=Y_FWD-38,FWD_B=Y_FWD+38;
const FWD_PAD=8,FWD_GAP=50;
const FBW=(FWD_R-FWD_L-FWD_PAD*2-FWD_GAP*2)/3;
const FBH=(FWD_B-FWD_T)-FWD_PAD*2-12;
const FBY=FWD_T+FWD_PAD+12+FBH/2;
const FX1=FWD_L+FWD_PAD+FBW/2,FX2=FX1+FBW+FWD_GAP,FX3=FX2+FBW+FWD_GAP;
const BWD_L=FWD_L,BWD_R=FWD_R;
const BWD_T=Y_BWD-32,BWD_B=Y_BWD+32;
const BWD_PAD=8,BWD_GAP=46;
const BBW=(BWD_R-BWD_L-BWD_PAD*2-BWD_GAP*2)/3;
const BBH=(BWD_B-BWD_T)-BWD_PAD*2-10;
const BBY=BWD_T+BWD_PAD+10+BBH/2;
const BX1=BWD_R-BWD_PAD-BBW/2,BX2=BX1-BBW-BWD_GAP,BX3=BX2-BBW-BWD_GAP;

const C={
  fwdFill:'#e8f0fe', fwdStroke:'#0107ba',
  bwdFill:'#f7f7f7', bwdStroke:'#1a1a1a',
  bgFwd:'#f8f9fa',   bgBwd:'#f8f9fa'
};

// ── BUILD PIPELINE SVG ───────────────────────────────────────────────────────
function buildSVG(){
  const svg=$('svg');
  const defs=defsEl=mk('defs');
  
function marker(id,color){
  const m=mk('marker',{id,markerWidth:10,markerHeight:9,refX:8.5,refY:4.5,orient:'auto'});
  m.appendChild(mk('path',{d:'M0,0 L9,4.5 L0,9 Z',fill:color,stroke:'none'}));
  return m;
}
[['mLoop','#0107ba'],['mGrey','#1a1a1a'],['mNormal','#d4d4d4']].forEach(([id,c])=>defs.appendChild(marker(id,c)));
  
  const sf=mk('filter',{id:'shadow',x:'-10%',y:'-10%',width:'120%',height:'130%'});
  const fe1=mk('feDropShadow',{dx:'0',dy:'2',stdDeviation:'3','flood-color':'rgba(0,0,0,0.12)'});
  sf.appendChild(fe1);defs.appendChild(sf);

  const gf=mk('filter',{id:'gTrav',x:'-60%',y:'-60%',width:'220%',height:'220%'});
  gf.appendChild(mk('feGaussianBlur',{'in':'SourceGraphic',stdDeviation:'4',result:'b'}));
  const fm=mk('feMerge');['b','SourceGraphic'].forEach(r=>{const n=mk('feMergeNode');n.setAttribute('in',r);fm.appendChild(n);});
  gf.appendChild(fm);defs.appendChild(gf);
  svg.appendChild(defs);
  
  const lBack=svg.appendChild(mk('g')), lArr=svg.appendChild(mk('g')), lNodes=svg.appendChild(mk('g')), lTravel=svg.appendChild(mk('g'));

  // Connector Arrows
  function arrow(id,d){
    lArr.appendChild(mk('path',{id:'arr-'+id,d,fill:'none',stroke:'#0107ba','stroke-width':2.8,'stroke-linecap':'round','stroke-linejoin':'round','marker-end':'url(#mLoop)'}));
  }
  const R=20;
  arrow('json-b1',`M${X_JSON},${Y_MID+IOH/2} L${X_JSON},${BBY-R} Q${X_JSON},${BBY} ${X_JSON-R},${BBY} L${BX1+BBW/2},${BBY}`);
  arrow('b1-b2',  `M${BX1-BBW/2},${BBY} L${BX2+BBW/2},${BBY}`);
  arrow('b2-b3',  `M${BX2-BBW/2},${BBY} L${BX3+BBW/2},${BBY}`);
  arrow('b3-pdf', `M${BX3-BBW/2},${BBY} L${X_PDF+R},${BBY} Q${X_PDF},${BBY} ${X_PDF},${BBY-R} L${X_PDF},${Y_MID+IOH/2}`);
  arrow('pdf-ocr', `M${X_PDF},${Y_MID-IOH/2} L${X_PDF},${FBY+R} Q${X_PDF},${FBY} ${X_PDF+R},${FBY} L${FX1-FBW/2},${FBY}`);
  arrow('ocr-cx', `M${FX1+FBW/2},${FBY} L${FX2-FBW/2},${FBY}`);
  arrow('cx-tp',  `M${FX2+FBW/2},${FBY} L${FX3-FBW/2},${FBY}`);
  arrow('tp-json', `M${FX3+FBW/2},${FBY} L${X_JSON-R},${FBY} Q${X_JSON},${FBY} ${X_JSON},${FBY+R} L${X_JSON},${Y_MID-IOH/2}`);

// Expanded Node Block Elements with custom image support & bottom-aligned text
  function drawNode(cx,cy,w,h,title,fill,stroke,titleColor,imgSrc){
    const g=mk('g');
    g.appendChild(mk('rect',{x:cx-w/2,y:cy-h/2,width:w,height:h,rx:10,fill,stroke,'stroke-width':1.5,filter:'url(#shadow)'}));
    
    let startLine = 0;
    let sy = cy; // Default vertical start position for normal processing boxes
    
    if(imgSrc) {
      // 1. Position the image clearly in the upper half of the box
      g.appendChild(mk('image',{
        href: imgSrc,
        x: cx - 18,        
        y: cy - h/2 + 10,  // Anchored near the top edge
        width: 36,
        height: 36
      }));
      startLine = 1; // Skips the emoji line
      
      // 2. Shift the text baseline down toward the bottom edge of the box
      sy = cy + h/2 - 22; 
    } else {
      // Original math to perfectly center text inside standard processing boxes
      const lines=title.split('\n'), totalH=lines.length*18;
      sy = cy - totalH/2 + 9;
    }
    
    const lines=title.split('\n');
    lines.forEach((l,i)=>{
      if(i >= startLine) { 
        // For image boxes, it calculates down from 'sy'; for standard boxes, it uses original pacing
        const lineY = imgSrc ? sy + (i - startLine)*18 : sy + i*18;
        
        tx(g.appendChild(mk('text',{
          x: cx,
          y: lineY,
          'text-anchor': 'middle',
          'dominant-baseline': 'middle',
          'font-size': 13,
          'font-weight': 'bold',
          'font-family': 'Plus Jakarta Sans',
          fill: titleColor||stroke
        })),l);
      }
    });
    lNodes.appendChild(g);
  }
  
 // Change "images/document_logo.png" to the exact path or URL of your image file
  drawNode(X_PDF, Y_MID,IOW,IOH,'\nINPUT X','#f8fafc','#334155','#1e293b', 'pipeline_images/doc_5.png');
  drawNode(X_JSON,Y_MID,IOW,IOH,'\nOUTPUT Y','#eff6ff','#0107ba','#1e293b', 'pipeline_images/json_out_2.png');

  drawNode(FX1,FBY,FBW,FBH,'Optical Character\nRecognition',C.fwdFill,C.fwdStroke);
  drawNode(FX2,FBY,FBW,FBH,'Cortex\nExtraction',            C.fwdFill,C.fwdStroke);
  drawNode(FX3,FBY,FBW,FBH,'Teacher\nPass',                 C.fwdFill,C.fwdStroke);
  drawNode(BX1,BBY,BBW,BBH,'Synth JSON',C.bwdFill,C.bwdStroke);
  drawNode(BX2,BBY,BBW,BBH,'Plan Layout',C.bwdFill,C.bwdStroke);
  drawNode(BX3,BBY,BBW,BBH,'PDF Rendering',C.bwdFill,C.bwdStroke);

  // ── DETACHED COMPONENT 1: THE TRAVELING DOCUMENT ICON ──────────────────────
  const tgDoc=mk('g',{id:'traveler-doc',style:'display:none'});
  const docVisuals = mk('g', {transform: 'translate(0, 0)'}); // Anchored center
  docVisuals.appendChild(mk('circle',{id:'tv-ring',cx:0,cy:0,r:26,fill:'none',stroke:'#0107ba','stroke-width':4,opacity:.25,filter:'url(#gTrav)'}));
  docVisuals.appendChild(mk('rect',{x:'-10',y:'-14',width:'20',height:'28',rx:'2',fill:'rgba(0,0,0,0.12)',transform:'translate(2,2)'}));
  docVisuals.appendChild(mk('path',{id:'tv-body',d:'M-10,-15 L5,-15 L11,-9 L11,15 L-10,15 Z',fill:'white',stroke:'#0107ba','stroke-width':'2'}));
  docVisuals.appendChild(mk('path',{d:'M5,-15 L5,-9 L11,-9 Z',fill:'#cbd5e1',stroke:'#0107ba','stroke-width':'1.2'}));
  tgDoc.appendChild(docVisuals);
  lTravel.appendChild(tgDoc);

  // ── DETACHED COMPONENT 2: THE INDEPENDENTLY POSITIONED MEDIA BOX ──────────
  const tgBox=mk('g',{id:'traveler-box',style:'display:none'});
  const fo = mk('foreignObject', { x: 0, y: 0, width: 240, height: 240 });
  const htmlContainer = document.createElement('div');
  htmlContainer.className = 'media-box-container';
  htmlContainer.id = 'typing-container';
  htmlContainer.innerHTML = `
    <div class="media-header-label" id="box-step-label">Step Content</div>
    <div class="media-content-stream" id="media-stream"></div>
  `;
  fo.appendChild(htmlContainer);
  tgBox.appendChild(fo);
  lTravel.appendChild(tgBox);

  htmlContainer.addEventListener('keydown', (e) => e.stopPropagation());
}

// ── CUSTOM MANUALLY SPECIFIED POSITION ARRAYS ────────────────────────────────
const TRAVELER_STOPS = [
  {x:X_JSON, y:Y_MID, boxX: 620, boxY: 65, label:"JSON Schema", text1:"Defines extraction targets: field names, types and weights.",
   html1:`<div style="background:#f0f2ff;border:1.5px solid #0107ba;border-radius:6px;padding:0;flex:1;display:flex;flex-direction:column;overflow:hidden;">
  <div style="background:#0107ba;padding:3px 8px;"><span style="color:white;font-size:7.5px;font-weight:bold;letter-spacing:.4px;">EXTRACTION SCHEMA</span></div>
  <div style="padding:6px 8px;display:flex;flex-direction:column;gap:3px;flex:1;">
    ${[['text','insured_name','0.15'],['text','policy_number','0.10'],['date','policy_start_date','0.10'],['date','policy_end_date','0.10'],['enum','policy_type','0.08'],['numeric','limit_of_indemnity','0.12'],['text','territory','0.08'],['text','jurisdiction','0.08']].map(([t,f,w])=>`
    <div style="display:flex;align-items:center;gap:5px;font-size:7px;">
      <span style="background:${t==='text'?'#0107ba':t==='date'?'#1e8a4a':'#b45309'};color:white;border-radius:2px;padding:1px 4px;font-size:6px;font-weight:bold;min-width:34px;text-align:center;">${t}</span>
      <span style="color:#1e293b;flex:1;">${f}</span>
      <span style="color:#64748b;font-size:6.5px;">w=${w}</span>
    </div>`).join('')}
  </div>
</div>`},
  {x:BX1, y:BBY, boxX: 540, boxY: 85, label:"Synth JSON Engine", text1:"LLM samples field values from schema + statistical pools.",
   html1:`<div style="background:#1a1b26;border-radius:6px;padding:0;flex:1;display:flex;flex-direction:column;overflow:hidden;">
  <div style="background:#13131f;padding:3px 8px;display:flex;align-items:center;gap:5px;border-bottom:1px solid #2a2a3f;">
    <div style="width:5px;height:5px;border-radius:50%;background:#ff5f57;"></div>
    <div style="width:5px;height:5px;border-radius:50%;background:#ffbd2e;"></div>
    <div style="width:5px;height:5px;border-radius:50%;background:#28c940;"></div>
    <span style="color:#6e7191;font-size:6.5px;margin-left:3px;">synth_document.json</span>
  </div>
  <div style="padding:7px 9px;flex:1;font-family:monospace;font-size:7.5px;line-height:1.65;color:#cdd6f4;">
    <span style="color:#6e7191">1 </span><span style="color:#89dceb">{</span><br>
    <span style="color:#6e7191">2 </span>&nbsp;<span style="color:#89b4fa">"insured_name"</span>: <span style="color:#a6e3a1">"Lagos Civil Infra."</span>,<br>
    <span style="color:#6e7191">3 </span>&nbsp;<span style="color:#89b4fa">"policy_number"</span>: <span style="color:#a6e3a1">"PI-NG-2024-0146"</span>,<br>
    <span style="color:#6e7191">4 </span>&nbsp;<span style="color:#89b4fa">"limit_of_indemnity"</span>: <span style="color:#fab387">5000000</span>,<br>
    <span style="color:#6e7191">5 </span>&nbsp;<span style="color:#89b4fa">"territory"</span>: <span style="color:#a6e3a1">"Nigeria"</span>,<br>
    <span style="color:#6e7191">6 </span>&nbsp;<span style="color:#89b4fa">"policy_type"</span>: <span style="color:#a6e3a1">"Claims-made"</span>,<br>
    <span style="color:#6e7191">7 </span>&nbsp;<span style="color:#89b4fa">"cover_trigger"</span>: <span style="color:#a6e3a1">"First Made"</span><br>
    <span style="color:#6e7191">8 </span><span style="color:#89dceb">}</span>
  </div>
</div>`},
  {x:BX2, y:BBY, boxX: 350, boxY: 85, label:"Plan Layout Analyzer", text1:"Selects template and assigns section IDs and clause order.",
   html1:`<div style="background:#f8fafc;border-radius:6px;padding:0;flex:1;display:flex;flex-direction:column;overflow:hidden;border:1px solid #e2e8f0;">
  <div style="background:#1a1a1a;padding:3px 8px;"><span style="color:#d4d4d4;font-size:7.5px;font-weight:bold;">general_pi.json — layout plan</span></div>
  <div style="padding:6px 8px;display:flex;flex-direction:column;gap:3px;flex:1;">
    ${[['§1','Policy Schedule','#0107ba','#dbeafe'],['§2','Governance Summary','#0107ba','#dbeafe'],['2a','↳ Blueprint Fields','#374151','#eff6ff'],['2b','↳ Clause Plan','#374151','#eff6ff'],['§3','Underwriting Notes','#0107ba','#dbeafe'],['§4','Risk Declarations','#0107ba','#dbeafe']].map(([id,name,tc,bg])=>`
    <div style="display:flex;align-items:center;gap:5px;background:${bg};border-left:3px solid ${tc};padding:2px 5px;border-radius:2px;font-size:7px;">
      <span style="color:${tc};font-weight:bold;min-width:14px;">${id}</span>
      <span style="color:#1e293b;">${name}</span>
    </div>`).join('')}
  </div>
</div>`},
  {x:BX3, y:BBY, boxX: 200, boxY: 85, label:"PDF Render Engine", text1:"Renders A4 PDF then degrades with scan noise and DPI variation.",
   html1:`<div style="background:#f8fafc;border-radius:6px;padding:0;flex:1;display:flex;flex-direction:column;overflow:hidden;border:1px solid #e2e8f0;">
  <div style="background:#1a1a1a;padding:3px 8px;"><span style="color:#d4d4d4;font-size:7.5px;font-weight:bold;">pdf_render_engine.py</span></div>
  <div style="padding:6px 8px;display:flex;flex-direction:column;gap:4px;flex:1;">
    ${[['3a','Render A4 PDF from template','#28c940'],['3b','Field dropout: visibility mask','#28c940'],['4a','Rasterize PDF → PNG (300 DPI)','#28c940'],['4b','Rotate ±2°, Gaussian blur','#28c940'],['4c','Degrade DPI to 72–150','#28c940']].map(([id,desc,col])=>`
    <div style="display:flex;align-items:flex-start;gap:5px;font-size:7px;line-height:1.3;">
      <span style="color:${col};font-size:9px;flex-shrink:0;margin-top:1px;">✓</span>
      <span style="color:#555;min-width:14px;flex-shrink:0;">${id}</span>
      <span style="color:#1e293b;">${desc}</span>
    </div>`).join('')}
  </div>
  <div style="background:#e5e7eb;padding:3px 8px;display:flex;justify-content:space-between;">
    <span style="font-size:6.5px;color:#555;">Target DPI: 72–150</span>
    <span style="font-size:6.5px;color:#555;">Output: PNG</span>
  </div>
</div>`},
  {x:X_PDF,  y:Y_MID, boxX: 110,  boxY: 75, label:"Input Document X",        text1:"",     img1:"pipeline_images/proposal_noisy.png"},
  {x:FX1,    y:FBY,   boxX: 150,  boxY: 55, label:"OCR Parsing",               text1:"",           img1:"pipeline_images/proposal_noisy_doctr.jpeg"},
  {x:FX2,    y:FBY,   boxX: 350,  boxY: 55, label:"Cortex Extractor",          text1:"", img1:"pipeline_images/extraction_v2.png"},
  {x:FX3,    y:FBY,   boxX: 540,  boxY: 55, label:"Canonicalisation & Teacher",text1:"",  img1:"pipeline_images/canonicalisation_v2.png"},
  {x:X_JSON, y:Y_MID, boxX: 620,  boxY: 65, label:"Output Y",                  text1:"", img1:"pipeline_images/output_y_v3.png"}
];

let step=0;

function updateTraveler(s){
  const tgDoc=$('traveler-doc');
  const tgBox=$('traveler-box');
  tgDoc.style.display='';
  tgBox.style.display='';
  
  const data = TRAVELER_STOPS[s];
  
  tgDoc.setAttribute('transform',`translate(${data.x}, ${data.y})`);
  tgBox.setAttribute('transform',`translate(${data.boxX}, ${data.boxY})`);
  
  const stream = $('media-stream');
  const label = $('box-step-label');
  
  if(data && stream && label) {
    label.textContent = data.label;
    const visual = data.html1
      ? data.html1
      : `<img class="stream-img" src="${data.img1}" alt="Process stage component A">`;
    stream.innerHTML = `${visual}<div class="stream-text">${data.text1}</div>`;
    stream.scrollTop = 0;
  }
}

const ARROW_SEQUENCE = ['arr-json-b1','arr-b1-b2','arr-b2-b3','arr-b3-pdf','arr-pdf-ocr','arr-ocr-cx','arr-cx-tp','arr-tp-json'];

function render(){
  ARROW_SEQUENCE.forEach((id, idx) => {
    const el = $(id);
    if(!el) return;
    
    if(idx < step) {
      const isBackward = id.includes('b1') || id.includes('b2') || id.includes('b3') || id === 'b3-pdf';
      el.setAttribute('stroke', isBackward ? '#1a1a1a' : '#0107ba');
      el.setAttribute('marker-end', isBackward ? 'url(#mGrey)' : 'url(#mLoop)');
      el.setAttribute('opacity','1');
    } else {
      el.setAttribute('stroke','#cbd5e1');
      el.setAttribute('marker-end', 'url(#mNormal)');
      el.setAttribute('opacity','0.4');
    }
  });

  updateTraveler(step);
  renderDots();
  $('counter').textContent = `Step ${step + 1} / ${TRAVELER_STOPS.length}`;
}

function renderDots(){
  const c=$('dots');c.innerHTML='';
  TRAVELER_STOPS.forEach((_,i)=>{
    const d=document.createElement('div');
    d.className = `dot ${i <= step ? 'active' : ''} ${i === step ? 'cur' : ''}`;
    c.appendChild(d);
  });
}

function next(){if(step < TRAVELER_STOPS.length - 1){step++;render();}}
function prev(){if(step > 0){step--;render();}}

buildSVG();
render();

$('canvas').addEventListener('click', (e) => {
  if (e.target.closest('.media-box-container')) return;
  next();
});

document.addEventListener('keydown',e=>{
  if(e.code==='Space'||e.code==='ArrowRight'){e.preventDefault();next();}
  if(e.code==='ArrowLeft'){e.preventDefault();prev();}
});
</script>
</body>
</html>
