<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Experimental Performance Graphics</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
  
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap');
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; font-family: 'Plus Jakarta Sans', -apple-system, sans-serif; background: white; color: #111; display: flex; flex-direction: column; }

    .panels-wrapper {
      position: relative; /* Added to anchor the absolute background positioning */
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      background: white;
      padding: 40px 20px 8% 20px; 
    }

    /* Added background image style matching your other slides */
    .s2-bg {
      position: absolute !important;
      inset: 0;
      background-image: url('logo_FRI/path4.png');
      background-repeat: no-repeat;
      background-position: center;
      background-size: 90%;
      opacity: 0.03;
      z-index: 0 !important;
      pointer-events: none;
    }

    .container-layout {
      width: 95%;
      max-width: 1200px;
      display: flex;
      flex-direction: column;
      position: relative; /* Added to layer safely over the background */
      z-index: 2; /* Added to layer safely over the background */
    }

    .panel-col-label {
      font-size: 2.2rem;
      font-weight: 700;
      color: #0107ba; 
      margin-bottom: 20px; 
      text-align: left;
    }

    .panels {
      display: flex;
      align-items: flex-start;
      justify-content: center;
      gap: 35px;
    }

    .panel-col {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 15px; 
    }

    h3 {
        font-size: 1.3rem;
        margin-bottom: 4px; 
        color: #111;
        border-bottom: 2px solid #111; 
        display: inline-block;
        padding-bottom: 4px;
        align-self: flex-start;
    }

    /* Top Performance summary header */
    .metrics-display {
        display: flex;
        justify-content: space-around;
        background: #f0f2ff;
        border: 1px solid #0107ba;
        border-radius: 8px;
        padding: 12px;
        text-align: center;
    }

    .metric-item {
        display: flex;
        flex-direction: column;
        gap: 2px;
    }

    .metric-label {
        font-size: 0.7rem;
        font-weight: bold;
        color: #111;
        text-transform: uppercase;
        letter-spacing: 0.5px;
    }

    .metric-value {
        font-size: 1.4rem;
        color: #0107ba;
        font-weight: bold;
    }

    .image-container {
      height: 48vh; 
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid #0107ba;
      border-radius: 6px;
      overflow: hidden;
      background: #f0f2ff;
    }

    .image-container img {
      max-width: 100%;
      max-height: 100%;
      display: block;
      object-fit: contain;
    }
  </style>
</head>
<body>
  <div class="panels-wrapper">
    <div class="s2-bg"></div>

    <div class="container-layout">
        <span class="panel-col-label">Results</span>
        
        <div class="panels">
            <div class="panel-col">
                <h3>Results by field type</h3>
                
                <div class="metrics-display">
                    <div class="metric-item">
                        <span class="metric-label">Score</span>
                        <span class="metric-value">\( \mathcal{S} = 0.647 \pm 0.062 \)</span>
                    </div>
                    <div class="metric-item">
                        <span class="metric-label">Accuracy</span>
                        <span class="metric-value">\( 82.2\% \pm 2.3 \)</span>
                    </div>
                </div>

                <div class="image-container">
                  <img src="evaluation/Match_status_by_field_type.png" alt="Evaluation Performance Graph">
                </div>
            </div>

          <div class="panel-col">
              <h3>Confidence of extracted answer</h3>

              <div class="metrics-display" style="border-color: #1e8a4a; background: #f0faf4; display: flex; flex-direction: column; gap: 14px; text-align: left; padding: 10px 18px;">
                  <div style="display: flex; align-items: center;">
                      <span style="font-size: 1rem; color: #1e8a4a; font-weight: 700; letter-spacing: -0.2px;">
                          Correct Predictions &rarr; <span style="color: #111; font-weight: 600;">Tend to have higher conf.</span>
                      </span>
                  </div>

                  <div style="display: flex; align-items: center;">
                      <span style="font-size: 1rem; color: #c92a2a; font-weight: 700; letter-spacing: -0.2px;">
                          Incorrect Predictions &rarr; <span style="color: #111; font-weight: 600;">Tend to have lower conf.</span>
                      </span>
                  </div>
              </div>

              <div class="image-container" style="border-color: #1e8a4a; background: #f0faf4;">
                <img src="evaluation/confidence_image_only_left.png" alt="Model Efficiency Pareto Frontier Graphic">
              </div>
          </div>
        </div>
    </div>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", function() {
        renderMathInElement(document.body, {
          delimiters: [
              {left: '$$', right: '$$', display: true},
              {left: '\\[', right: '\\]', display: true},
              {left: '$', right: '$', display: false},
              {left: '\\(', right: '\\)', display: false}
          ],
          throwOnError : false
        });
    });
  </script>
</body>
</html>
