<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>User Interface Showcase</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap');
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; font-family: 'Plus Jakarta Sans', -apple-system, sans-serif; background: white; color: #111; display: flex; flex-direction: column; }

    .panels-wrapper {
      position: relative; /* Added to anchor the absolute background positioning */
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      background: white;
      padding: 40px 40px 5% 40px; 
    }

    /* Added background image style matching your other slides */
    .s2-bg {
      position: absolute !important;
      inset: 0;
      background-image: url('logo_FRI/path4.png');
      background-repeat: no-repeat;
      background-position: center;
      background-size: 90%;
      opacity: 0.03;
      z-index: 0 !important;
      pointer-events: none;
    }

    .container-layout {
      width: 100%;
      max-width: 1240px;
      display: flex;
      flex-direction: column;
      position: relative; /* Added to layer safely over the background */
      z-index: 2; /* Added to layer safely over the background */
    }

    .panel-col-label {
      font-size: 2.2rem;
      font-weight: 700;
      color: #0107ba;
      margin-bottom: 20px;
      text-align: left;
      width: 100%;
    }

    .content-wrapper-80 {
      width: 90%;
      margin: 0 auto; 
      display: flex;
      flex-direction: column;
    }

    .panel-col-label {
      font-size: 2.2rem;
      font-weight: 700;
      color: #0107ba;
      margin-bottom: 20px;
      text-align: left;
      width: 100%;
    }

    .ui-screenshot-container {
      width: 100%;
      height: 72vh;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 2px solid #0107ba;
      border-radius: 12px;
      overflow: hidden;
      background: #f0f2ff;
      box-shadow: 0 4px 24px rgba(1,7,186,0.15);
    }

    .ui-screenshot-container img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: contain; 
    }
  </style>
</head>
<body>
  <div class="panels-wrapper">
    <div class="s2-bg"></div>

    <div class="container-layout">        
        <span class="panel-col-label">Platform Demo</span>
        <div class="content-wrapper-80">
            <div class="ui-screenshot-container">
              <img id="screenshot-display" src="/screenshot/image1.png" alt="UI Showcase">
            </div>
        </div>
    </div>
  </div>

  <script>
    const images = [
      "/screenshot/image1.png",
      "/screenshot/image2.png",
      "/screenshot/image3.png",
      "/screenshot/image4.png"
    ];

    let currentIndex = 0;
    const imgElement = document.getElementById("screenshot-display");

    window.addEventListener("keydown", function(event) {
      if (event.code === "Space" || event.keyCode === 32) {
        event.preventDefault();
        currentIndex = (currentIndex + 1) % images.length;
        imgElement.src = images[currentIndex];
      }
    });
  </script>
</body>
</html>
