<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Performance Trade-offs</title>
  <script src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>
  <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; font-family: Arial, sans-serif; background: white; color: #111; display: flex; flex-direction: column; }

    .panels-wrapper {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      background: white;
      padding: 20px 20px 5% 20px;
    }

    .container-layout {
      width: 100%;
      max-width: 1200px;
      display: flex;
      flex-direction: column;
    }

    /* Main Title: Left aligned and blue */
    .panel-col-label {
      font-size: 2.2rem;
      font-weight: 700;
      color: #0107ba;
      margin-bottom: 5px;
      text-align: left;
    }

    /* LaTeX Formula Section Design */
    .formula-container {
      background: #f8f9fa;
      border-left: 4px solid #0107ba;
      padding: 15px 20px;
      margin-bottom: 25px;
      border-radius: 0 6px 6px 0;
    }

    .formula-explanation {
      font-size: 1rem;
      color: #444;
      margin-bottom: 8px;
      line-height: 1.4;
    }

    .math-display {
      font-size: 1.15rem;
      color: #111;
    }

    .panels {
      display: flex;
      align-items: flex-start;
      justify-content: center;
    }

    .panel-col {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 12px;
      max-width: 500px; /* Centers and limits width for a cleaner single-chart look */
      margin: 0 auto;
    }

    /* Subtitles: Dark underline and closer to content */
    h3 {
        font-size: 1.3rem;
        margin-bottom: 4px;
        color: #333;
        border-bottom: 2px solid #111;
        display: inline-block;
        padding-bottom: 4px;
    }

    .image-container {
      height: 60vh; /* Expanded height slightly since it is now a single-focused asset */
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid #d0d0d0;
      border-radius: 6px;
      overflow: hidden;
      background: #fafafa;
    }

    .image-container img {
      max-width: 100%;
      max-height: 100%;
      display: block;
      object-fit: contain;
    }
  </style>
</head>
<body>
  <div class="panels-wrapper">
    <div class="container-layout">
        <span class="panel-col-label">Pipeline Confidence</span>
        
        <div class="formula-container">
          <p class="formula-explanation">
            We define the confidence of the extracted value as how smoothly it was extracted throughout the pipeline: 
          </p>
          <div class="math-display">
            $$\text{Conf} = \text{Conf}_{\text{OCR}} \times \text{Conf}_{\text{Span}} \times \text{Canonicalization Type} \times (0.85)^{N_{\text{teacher retry}}}$$
          </div>
        </div>
        
        <div class="panels">
            <div class="panel-col">
                <div class="image-container">
                  <img src="evaluation/confidence_image_only_left.png" alt="Model Efficiency Pareto Frontier Graphic">
                </div>
            </div>
        </div>
    </div>
  </div>
</body>
</html>
