<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Noise Comparison</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap');
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; font-family: 'Plus Jakarta Sans', -apple-system, sans-serif; background: white; color: #111; display: flex; flex-direction: column; }

    .panels-wrapper {
      position: relative; /* Added to anchor the absolute background positioning */
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      background: white;
      padding: 40px 20px 10% 20px; 
    }

    /* Added background image style matching your other slides */
    .s2-bg {
      position: absolute !important;
      inset: 0;
      background-image: url('logo_FRI/path4.png');
      background-repeat: no-repeat;
      background-position: center;
      background-size: 90%;
      opacity: 0.03;
      z-index: 0 !important;
      pointer-events: none;
    }

    .container-layout {
      width: 100%;
      max-width: 1200px;
      display: flex;
      flex-direction: column;
      position: relative; /* Added to layer safely over the background */
      z-index: 2; /* Added to layer safely over the background */
    }

    /* Main Title: Blue color from previous turns */
    .panel-col-label {
      font-size: 1.5rem;
      font-weight: 700;
      color: #0107ba;
      margin-bottom: 15px;
      text-align: left;
    }

    .panels {
      display: flex;
      align-items: flex-start;
      justify-content: center;
      gap: 50px;
    }

    .panel-col {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    /* Subtitles: Dark underline as requested */
    h3 {
        font-size: 1.0rem;
        margin-bottom: 6px;
        color: #111;
        border-bottom: 2px solid #111;
        display: inline-block;
        padding-bottom: 4px;
    }

    .description-text {
        font-size: 0.95rem;
        line-height: 1.4;
        color: #111;
        margin-bottom: 10px;
    }

    .image-container {
      aspect-ratio: 1 / 1.414;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 10px;
      overflow: hidden;
    }

    .image-container img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: contain;
    }

    .image-container.left {
      border: 2px solid #0107ba;
      background: #f0f2ff;
      box-shadow: 0 4px 20px rgba(1,7,186,0.15);
    }

    .image-container.right {
      border: 2px solid #1e8a4a;
      background: #f0faf4;
      box-shadow: 0 4px 20px rgba(30,138,74,0.15);
    }

    .caption {
        font-size: 0.85rem;
        font-weight: bold;
        text-align: center;
        color: #111;
        margin-top: 8px;
    }
  </style>
</head>
<body>
  <div class="panels-wrapper">
    <div class="s2-bg"></div>

    <div class="container-layout">
        <span class="panel-col-label">Synthetic Data Augmentation</span>
        
        <div class="panels">
            <div class="panel-col">
                <h3>Clean Input (doc001)</h3>
                <p class="description-text">Standard digital PDF output with perfect text alignment and no background artifacts.</p>
                <div class="image-container left">
                  <img src="pdf_images/doc001/proposal (26)-1.png" alt="Clean Document Sample">
                </div>
                <div class="caption">Original Proposal Page 1</div>
            </div>

            <div class="panel-col">
                <h3>Noisy Version (doc001_noisy)</h3>
                <p class="description-text">Simulated scan noise: rotation (+/- 2°), Gaussian blur, and brightness variations.</p>
                <div class="image-container right">
                  <img src="pdf_images/doc001_noisy/proposal_noisy (25)-1.png" alt="Noisy Document Sample">
                </div>
                <div class="caption">Augmented Noisy Sample</div>
            </div>
        </div>
    </div>
  </div>
</body>
</html>
