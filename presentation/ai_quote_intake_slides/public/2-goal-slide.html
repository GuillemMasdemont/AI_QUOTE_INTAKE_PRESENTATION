<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Goal</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap');
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; font-family: 'Plus Jakarta Sans', -apple-system, sans-serif; background: white; color: #111; display: flex; flex-direction: column; }

    .panels-wrapper {
      position: relative;
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      background: white;
      padding: 40px 20px 14% 20px;
    }

    .s2-bg {
      position: absolute !important;
      inset: 0;
      background-image: url('logo_FRI/path4.png');
      background-repeat: no-repeat;
      background-position: center;
      background-size: 90%;
      opacity: 0.03;
      z-index: 0 !important;
      pointer-events: none;
    }

    .panels {
      display: flex; 
      align-items: center;
      justify-content: center;
      gap: 24px;
      position: relative;
      z-index: 2;
    }

    .panel-col {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    .panel-col-label {
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: 0.2px;
      color: #111;
    }

    .panel-pdf {
      aspect-ratio: 1 / 1.414;
      height: 80vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      border-radius: 12px;
      border: 2px solid #0107ba;
      box-shadow: 0 4px 20px rgba(1,7,186,0.15);
      background: #f0f2ff;
    }

    .panel-output {
      aspect-ratio: 1 / 1.2;
      height: 80vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      border-radius: 12px;
      border: 2px solid #1e8a4a;
      box-shadow: 0 4px 20px rgba(30,138,74,0.15);
      background: #f0faf4;
      cursor: pointer;
    }

    .pdf-container {
      flex: 1;
      overflow: hidden;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .pdf-container img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: contain;
    }

    /* Translucent Highlight Box Styling */
    .highlight-box {
      position: absolute;
      border: 1.5px solid #ff4d00d3;
      background-color: rgba(252, 214, 0, 0.503);
      border-radius: 2px;
      pointer-events: none;
      z-index: 10;
      transition: all 0.2s ease-in-out;
    }

    .page-indicator {
      position: absolute;
      bottom: 6px;
      right: 8px;
      font-size: 0.6rem;
      color: #aaa;
      background: rgba(255,255,255,0.8);
      padding: 1px 4px;
      border-radius: 3px;
      pointer-events: none;
    }

    .panel-output img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    .arrow {
      font-size: 3rem;
      color: #111;
      font-weight: 700;
      flex-shrink: 0;
    }
  </style>
</head>
<body>
  <div class="panels-wrapper">
    <div class="s2-bg"></div>

    <div class="panels">
      <div class="panel-col">
        <span class="panel-col-label" style="color:#0107ba;">Insurance Proposal</span>
        <div class="panel-pdf">
          <div class="pdf-container" id="pdfContainer">
            <img id="pdfImg" src="/pdf_images/docCatalunya/proposal_catalunya_page-0001.jpg" alt="page 1">
            <div class="page-indicator" id="pageIndicator">1 / 8</div>
          </div>
        </div>
      </div>
      <div class="arrow">→</div>
      <div class="panel-col">
        <span class="panel-col-label" style="color:#1e8a4a;">Structured Output</span>
        <div class="panel-output" id="outputPanel">
          <img id="outputImg" src="/screenshot/results_right_1.png" alt="Structured Output">
        </div>
      </div>
    </div>
  </div>

  <script>
    // --- Left Panel Pagination Logic ---
    const pages = Array.from({length: 8}, (_, i) =>
      `/pdf_images/docCatalunya/proposal_catalunya_page-${String(1).padStart(4, '0')}.jpg`
    );
    let current = 0;
    const img = document.getElementById('pdfImg');
    const indicator = document.getElementById('pageIndicator');
    const pdfContainer = document.getElementById('pdfContainer');

    pdfContainer.addEventListener('click', () => {
      current = (current + 1) % pages.length;
      img.src = pages[current];
      indicator.textContent = `${current + 1} / ${pages.length}`;
      
      // Clear highlight box when changing document pages manually
      const existingBox = document.getElementById('highlightBox');
      if (existingBox) existingBox.remove();
    });

    // --- Right Panel Images & Highlight Configurations ---
    const rightPages = [
      {
        src: '/screenshot/results_right_1.png',
        box: null // No highlight box for the first image
      },
      {
        src: '/screenshot/results_right_2.png',
        box: { top: '25.8%', left: '38%', width: '15%', height: '3%' } // Box definition
      },
      {
        src: '/screenshot/results_right_3.png',
        box: { top: '40%', left: '38%', width: '30%', height: '3%' } // Example 3rd page box
      }
    ];

    let currentRightIndex = 0;
    const outputPanel = document.getElementById('outputPanel');
    const outputImg = document.getElementById('outputImg');

    outputPanel.addEventListener('click', () => {
      // 1. Cycle to the next right image
      currentRightIndex = (currentRightIndex + 1) % rightPages.length;
      const currentPageData = rightPages[currentRightIndex];
      
      // Update image source
      outputImg.src = currentPageData.src;

      // 2. Manage the bounding highlight box
      let box = document.getElementById('highlightBox');

      if (currentPageData.box) {
        // If box configuration exists, create or update it
        if (!box) {
          box = document.createElement('div');
          box.id = 'highlightBox';
          box.className = 'highlight-box';
          pdfContainer.appendChild(box);
        }
        // Assign the targeted coordinates
        box.style.top = currentPageData.box.top;
        box.style.left = currentPageData.box.left;
        box.style.width = currentPageData.box.width;
        box.style.height = currentPageData.box.height;
      } else {
        // If the box config is null, remove any existing box
        if (box) {
          box.remove();
        }
      }
    });
  </script>
</body>
</html>
